.flowBar{height:30%;border-radius:12px 12px 6px 6px;animation:rfFlow 2.4s ease-in-out infinite alternate}
@keyframes rfFlow{0%{height:18%}30%{height:88%}65%{height:42%}100%{height:72%}}
.rf.calm .flowBar{animation:none;height:60%}
@media (prefers-reduced-motion: reduce){.flowBar{animation:none;height:60%}}

</style>
</head>
<body>
<div id="stage"><div id="root"></div></div>
<template id="tpl">
<div class="rf {{calmCls}}" style="width: 390px; height: 844px;">

<!-- ============ WELCOME ============ -->
<sc-if value="{{s.welcome}}" hint-placeholder-val="{{ true }}">
<div class="scr" style="background: #F6F4EF;">
  <svg aria-hidden="true" viewBox="0 0 390 560" style="position: absolute; top: 0; left: 0; width: 390px; height: 560px;">
    <rect x="0" y="0" width="390" height="560" fill="#F6F4EF"></rect>
    <path d="M0 0 H390 V330 C280 390 254 530 239 560 H151 C136 530 110 390 0 330Z" fill="#8FB5A3"></path>
    <path d="M0 0 H390 V250 C280 310 238 450 223 560 H167 C152 450 110 310 0 250Z" fill="#7FA3B8"></path>
    <path d="M0 0 H390 V180 C280 240 226 380 211 560 H179 C164 380 110 240 0 180Z" fill="#5F7A80"></path>
    <path d="M0 0 H390 V110 C280 170 218 310 203 560 H187 C172 310 110 170 0 110Z" fill="#2C403C"></path>
    <path d="M18 290 C70 320 110 360 140 420" stroke="#F6F4EF" stroke-opacity=".35" stroke-width="1.2" fill="none"></path>
    <path d="M30 222 C90 255 135 300 165 380" stroke="#F6F4EF" stroke-opacity=".3" stroke-width="1.2" fill="none"></path>
    <path d="M372 290 C320 320 280 360 250 420" stroke="#F6F4EF" stroke-opacity=".35" stroke-width="1.2" fill="none"></path>
    <path d="M360 222 C300 255 255 300 225 380" stroke="#F6F4EF" stroke-opacity=".3" stroke-width="1.2" fill="none"></path>
    <circle cx="96" cy="58" r="1.4" fill="#F6F4EF"></circle>
    <circle cx="212" cy="40" r="1.1" fill="#F6F4EF"></circle>
    <circle cx="160" cy="120" r="1.2" fill="#F6F4EF"></circle>
    <circle cx="238" cy="170" r="1" fill="#F6F4EF"></circle>
    <circle cx="190" cy="230" r="1.1" fill="#F6F4EF"></circle>
    <circle cx="320" cy="72" r="1.3" fill="#F6F4EF"></circle>
    <path d="M286 98 a14 14 0 1 0 14 18 a11 11 0 1 1 -14 -18z" fill="#F5C59A"></path>
    <rect x="186" y="508" width="18" height="40" rx="9" fill="#E39A6B" stroke="#7A4A2F" stroke-width="1.5"></rect>
    <path d="M195 516 v24" stroke="#7A4A2F" stroke-width="1"></path>
    <path d="M186 528 L162 540 M204 528 L228 540" stroke="#2C403C" stroke-width="1.5"></path>
  </svg>
  <div style="margin-top: auto; padding: 0 28px 44px; display: flex; flex-direction: column; gap: 18px; position: relative;">
    <div class="wm" style="font-size: 58px; line-height: 1;">Reflow</div>
    <p style="margin: 0; font-size: 20px; font-weight: 300; line-height: 1.35; color: #2B3A37; max-width: 280px;">Plans change. Your study plan can, too.</p>
    <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 18px;">
      <span style="font-size: 14px; color: #5E6F6B;">Takes about a minute</span>
      <button class="btnDark" style="padding: 0 10px 0 22px; gap: 16px;" onClick="{{beginOnboarding}}">Get started
        <span style="width: 34px; height: 34px; border-radius: 10px; background: #F5C59A; color: #2E3F3B; display: flex; align-items: center; justify-content: center;">
          <svg class="icon" style="width: 18px; height: 18px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
        </span>
      </button>
    </div>
  </div>
</div>
</sc-if>

<!-- ============ ONBOARDING ============ -->
<sc-if value="{{s.onboard}}" hint-placeholder-val="{{ false }}">
<div class="scr">
  <div class="{{obHeadCls}}" style="padding: 50px 20px 0; display: flex; align-items: center; gap: 10px;">
    <button class="iconBtn" style="color: #EEF3F0;" onClick="{{obBack}}" aria-label="Back">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
    <div style="flex: 1; display: flex; gap: 5px;" role="progressbar" aria-label="Setup progress" aria-valuemin="1" aria-valuemax="{{obTotal}}" aria-valuenow="{{obNum}}">
      <sc-for list="{{obSegs}}" as="g" hint-placeholder-count="7">
        <span style="flex: 1; height: 4px; border-radius: 4px; background: {{g.bg}};"></span>
      </sc-for>
    </div>
    <span class="lbl" style="min-width: 40px; text-align: right;">{{obNum}}/{{obTotal}}</span>
  </div>
  <div class="scroll" style="padding: 26px 24px 140px;">

    <sc-if value="{{ob.name}}" hint-placeholder-val="{{ true }}">
      <div class="lbl">Welcome to Reflow</div>
      <h1 class="obH">Let’s build a plan that bends when life does.</h1>
      <p class="obP">A few quick questions. You can change every answer later.</p>
      <label for="rf-name" class="lbl" style="display: block; margin: 34px 0 6px;">What should we call you?</label>
      <input id="rf-name" class="fieldDark" placeholder="Your first name" value="{{nameVal}}" onChange="{{onName}}" autocomplete="given-name">
      <div style="display: flex; flex-direction: column; gap: 18px; margin-top: 40px;">
        <div style="display: flex; gap: 14px; align-items: flex-start;">
          <span class="obIcon"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg></span>
          <span style="display: flex; flex-direction: column; gap: 3px;"><span style="font-size: 16px;">Planned around your real day</span><span class="mute" style="font-size: 13px;">Sleep, college and fixed hours stay protected.</span></span>
        </div>
        <div style="display: flex; gap: 14px; align-items: flex-start;">
          <span class="obIcon"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12c3-5 6-5 9 0s6 5 9 0"></path></svg></span>
          <span style="display: flex; flex-direction: column; gap: 3px;"><span style="font-size: 16px;">Reflows when plans break</span><span class="mute" style="font-size: 13px;">Missed a session? It finds a realistic next step.</span></span>
        </div>
        <div style="display: flex; gap: 14px; align-items: flex-start;">
          <span class="obIcon"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20v-8M12 20V5M19 20v-5"></path></svg></span>
          <span style="display: flex; flex-direction: column; gap: 3px;"><span style="font-size: 16px;">Honest progress</span><span class="mute" style="font-size: 13px;">Real focus time, no streak guilt.</span></span>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{ob.goal}}" hint-placeholder-val="{{ false }}">
      <h1 class="obH">{{goalTitle}}</h1>
      <p class="obP">Pick an exam, or just track your study time.</p>
      <div style="margin-top: 14px;">
        <sc-for list="{{examOpts}}" as="e" hint-placeholder-count="6">
          <button class="row" onClick="{{e.pick}}" aria-pressed="{{e.on}}">
            <span style="width: 48px; height: 44px; border-radius: 12px; border: 1px solid {{e.border}}; background: {{e.bg}}; color: {{e.fg}}; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex-shrink: 0;">{{e.abbr}}</span>
            <span style="flex: 1; display: flex; flex-direction: column; gap: 2px;">
              <span style="font-size: 17px;">{{e.name}}</span>
              <span class="mute" style="font-size: 13px;">{{e.full}}</span>
            </span>
            <sc-if value="{{e.on}}" hint-placeholder-val="{{ false }}">
              <svg class="icon" style="color: #F5C59A;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
            </sc-if>
          </button>
        </sc-for>
      </div>
      <sc-if value="{{isCds}}" hint-placeholder-val="{{ true }}">
        <div class="card" style="margin-top: 20px; display: flex; flex-direction: column; gap: 16px;">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 14px;">
            <span style="display: flex; flex-direction: column; gap: 4px;"><span style="font-size: 16px;">Use built-in 4-month timetable</span><span class="mute" style="font-size: 13px; line-height: 1.45;">{{builtinHint}}</span></span>
            <button class="toggle {{builtinCls}}" onClick="{{toggleBuiltinOb}}" aria-pressed="{{cdsBuiltin}}" aria-label="Use built-in 4-month CDS timetable"></button>
          </div>
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;">
            <span class="mute" style="font-size: 14px;">Your track</span>
            <span style="display: flex; gap: 8px;">
              <sc-for list="{{trackOpts}}" as="o" hint-placeholder-count="2">
                <button class="chip {{o.cls}}" style="min-height: 40px; padding: 0 12px; font-size: 13px;" onClick="{{o.pick}}" aria-pressed="{{o.on}}">{{o.label}}</button>
              </sc-for>
            </span>
          </div>
          <span class="mute" style="font-size: 12px; line-height: 1.45;">You can change both later in Me.</span>
        </div>
      </sc-if>
    </sc-if>

    <sc-if value="{{ob.timetable}}" hint-placeholder-val="{{ false }}">
      <h1 class="obH">Your timetable</h1>
      <p class="obP">Add the study blocks you plan to follow each day or week. Only these will show on Today.</p>
      <sc-if value="{{tt.empty}}" hint-placeholder-val="{{ true }}">
        <p class="mute" style="font-size: 15px; line-height: 1.5; margin: 16px 0 4px;">No blocks yet. Add your first study block below.</p>
      </sc-if>
      <sc-for list="{{tt.rows}}" as="b" hint-placeholder-count="2">
        <div class="row" style="gap: 12px;">
          <span style="width: 50px; display: flex; flex-direction: column; gap: 2px;">
            <span style="font-size: 15px;">{{b.time}}</span>
            <span class="mute" style="font-size: 12px;">{{b.end}}</span>
          </span>
          <span style="width: 3px; align-self: stretch; border-radius: 3px; background: {{b.color}};"></span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0;">
            <span style="font-size: 15px;">{{b.title}}</span>
            <span class="mute" style="font-size: 13px;">{{b.subject}} · {{b.dur}} · {{b.days}}</span>
          </span>
          <button class="iconBtn" onClick="{{b.remove}}" aria-label="{{b.removeAria}}">
            <svg class="icon" style="width: 18px; height: 18px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
          </button>
        </div>
      </sc-for>
      <div class="card" style="margin-top: 18px; display: flex; flex-direction: column; gap: 14px;">
        <span class="lbl">Add a study block</span>
        <input class="fieldInline boxed" style="flex: none; width: 100%;" placeholder="What will you study? e.g. Algebra practice" value="{{bd.title}}" onChange="{{bd.onTitle}}" aria-label="Block title">
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
          <sc-for list="{{bd.subjOpts}}" as="o" hint-placeholder-count="3">
            <button class="chip {{o.cls}}" style="min-height: 40px; padding: 0 12px; font-size: 13px;" onClick="{{o.pick}}" aria-pressed="{{o.on}}"><span class="dot" style="background: {{o.color}};"></span>{{o.name}}</button>
          </sc-for>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <span><span class="lbl" style="display: block;">Starts at</span><span style="font-size: 24px; font-weight: 300;">{{bd.startLabel}}</span></span>
          <span style="display: flex; gap: 10px;">
            <button class="stepBtn" onClick="{{bd.startDown}}" aria-label="15 minutes earlier">−</button>
            <button class="stepBtn" onClick="{{bd.startUp}}" aria-label="15 minutes later">+</button>
          </span>
        </div>
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
          <sc-for list="{{bd.durOpts}}" as="o" hint-placeholder-count="5">
            <button class="chip {{o.cls}}" style="min-height: 40px; padding: 0 12px; font-size: 13px;" onClick="{{o.pick}}" aria-pressed="{{o.on}}">{{o.label}}</button>
          </sc-for>
        </div>
        <div>
          <div class="lbl" style="margin-bottom: 10px;">Repeats</div>
          <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px;">
            <sc-for list="{{bd.repeatOpts}}" as="o" hint-placeholder-count="3">
              <button class="chip {{o.cls}}" style="min-height: 40px; padding: 0 12px; font-size: 13px;" onClick="{{o.pick}}" aria-pressed="{{o.on}}">{{o.label}}</button>
            </sc-for>
          </div>
          <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px;">
            <sc-for list="{{bd.dayOpts}}" as="o" hint-placeholder-count="7">
              <button class="chip {{o.cls}}" style="min-height: 40px; padding: 0; justify-content: center; font-size: 13px;" onClick="{{o.pick}}" aria-pressed="{{o.on}}" aria-label="{{o.aria}}">{{o.label}}</button>
            </sc-for>
          </div>
        </div>
        <sc-if value="{{bd.hasWarn}}" hint-placeholder-val="{{ false }}">
          <p style="margin: 0; font-size: 13px; line-height: 1.45; color: #F1C3BE;">{{bd.warn}}</p>
        </sc-if>
        <button class="btnSoft" style="min-height: 52px; opacity: {{bd.opacity}};" onClick="{{bd.add}}" disabled="{{bd.invalid}}">Add to my timetable</button>
      </div>
      <p class="mute" style="font-size: 13px; line-height: 1.5; margin-top: 14px;">{{tt.summary}}</p>
      <sc-if value="{{tt.over}}" hint-placeholder-val="{{ false }}"><p style="font-size: 13px; line-height: 1.5; margin: 8px 0 0; color: #F5C59A;">{{tt.overText}}</p></sc-if>
    </sc-if>

    <sc-if value="{{ob.date}}" hint-placeholder-val="{{ false }}">
      <h1 class="obH">{{obExamQ}}</h1>
      <p class="obP">Reflow counts down and protects the most important work as it gets close.</p>
      <sc-if value="{{hasExamDate}}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; align-items: flex-end; justify-content: space-between; padding: 26px 0 22px; border-bottom: 1px solid rgba(238,243,240,.14);">
          <div>
            <div class="thin" style="font-size: 72px;">{{examDay}}</div>
            <div style="font-size: 18px; font-weight: 300; margin-top: 6px;">{{examMonthYear}}</div>
          </div>
          <div style="text-align: right;">
            <div class="thin" style="font-size: 44px; color: #F5C59A;">{{daysLeft}}</div>
            <div class="lbl" style="margin-top: 6px;">days to go</div>
          </div>
        </div>
        <div class="row" style="justify-content: space-between;">
          <span class="mute">Month</span>
          <span style="display: flex; gap: 10px;">
            <button class="stepBtn" onClick="{{dateMonthDown}}" aria-label="Previous month">‹</button>
            <button class="stepBtn" onClick="{{dateMonthUp}}" aria-label="Next month">›</button>
          </span>
        </div>
        <div class="row" style="justify-content: space-between;">
          <span class="mute">Day</span>
          <span style="display: flex; gap: 10px;">
            <button class="stepBtn" onClick="{{dateDayDown}}" aria-label="Previous day">‹</button>
            <button class="stepBtn" onClick="{{dateDayUp}}" aria-label="Next day">›</button>
          </span>
        </div>
      </sc-if>
      <sc-if value="{{noExamDate}}" hint-placeholder-val="{{ false }}">
        <div class="card" style="display: flex; flex-direction: column; gap: 8px; margin-top: 24px;">
          <span style="font-size: 18px;">No date yet</span>
          <span class="mute" style="font-size: 14px; line-height: 1.45;">Reflow will plan week by week. Add the date any time from Me.</span>
        </div>
      </sc-if>
      <div class="row" style="justify-content: space-between; border-bottom: none;">
        <span>I don’t know the date yet</span>
        <button class="toggle {{noDateCls}}" onClick="{{toggleNoDate}}" aria-pressed="{{noExamDate}}" aria-label="No exam date yet"></button>
      </div>
    </sc-if>

    <sc-if value="{{ob.time}}" hint-placeholder-val="{{ false }}">
      <h1 class="obH">How much do you study?</h1>
      <p class="obP">Be honest about now. Reflow plans from where you are.</p>
      <div style="padding: 28px 0 18px; border-bottom: 1px solid rgba(238,243,240,.14);">
        <div style="display: flex; align-items: baseline; justify-content: space-between;">
          <label for="rf-cur" class="lbl">On a typical day now</label>
          <span class="thin" style="font-size: 40px;">{{curLabel}}</span>
        </div>
        <input id="rf-cur" type="range" class="rng neutral" min="0" max="600" step="15" value="{{current}}" onChange="{{onCurrent}}">
        <div class="mute" style="display: flex; justify-content: space-between; font-size: 12px;"><span>0</span><span>5h</span><span>10h</span></div>
      </div>
      <div style="padding: 24px 0 18px;">
        <div style="display: flex; align-items: baseline; justify-content: space-between;">
          <label for="rf-tgt" class="lbl">Your daily target</label>
          <span class="thin" style="font-size: 40px; color: #F5C59A;">{{tgtLabel}}</span>
        </div>
        <input id="rf-tgt" type="range" class="rng" min="15" max="720" step="5" value="{{target}}" onChange="{{onTarget}}">
        <div class="mute" style="display: flex; justify-content: space-between; font-size: 12px;"><span>15m</span><span>6h</span><span>12h</span></div>
      </div>
      <div class="card" style="font-size: 14px; line-height: 1.5;">{{timeNote}}</div>
    </sc-if>

    <sc-if value="{{ob.subjects}}" hint-placeholder-val="{{ false }}">
      <h1 class="obH">Your subjects</h1>
      <p class="obP">{{subjIntro}}</p>
      <div style="margin-top: 14px;">
        <sc-for list="{{subjRows}}" as="o" hint-placeholder-count="4">
          <div class="row" style="gap: 10px; padding: 8px 0;">
            <span class="dot" style="background: {{o.color}};"></span>
            <input class="fieldInline" value="{{o.name}}" onChange="{{o.rename}}" aria-label="Subject name">
            <button class="prio {{o.prioCls}}" onClick="{{o.cycle}}" aria-label="{{o.prioAria}}">{{o.prioLabel}}</button>
            <button class="iconBtn" onClick="{{o.remove}}" aria-label="{{o.removeAria}}">
              <svg class="icon" style="width: 18px; height: 18px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
            </button>
          </div>
        </sc-for>
      </div>
      <div style="display: flex; gap: 10px; margin-top: 16px;">
        <input class="fieldInline boxed" placeholder="Add your own subject" value="{{newSubj}}" onChange="{{onNewSubj}}" onKeyDown="{{newSubjKey}}" enterkeyhint="done" aria-label="New subject name">
        <button class="chip" onClick="{{addSubj}}" disabled="{{newSubjEmpty}}">Add</button>
      </div>
      <sc-if value="{{hasSuggest}}" hint-placeholder-val="{{ false }}">
        <div class="lbl" style="margin: 22px 0 10px;">Suggested</div>
        <div style="display: flex; flex-wrap: wrap; gap: 8px;">
          <sc-for list="{{suggest}}" as="g" hint-placeholder-count="2">
            <button class="chip" onClick="{{g.add}}">+ {{g.name}}</button>
          </sc-for>
        </div>
      </sc-if>
      <p class="mute" style="font-size: 13px; line-height: 1.5; margin-top: 20px;">Tap the priority to switch between High, Normal and Low. High-priority subjects get more study blocks.</p>
    </sc-if>

    <sc-if value="{{ob.routine}}" hint-placeholder-val="{{ false }}">
      <h1 class="obH">Your daily routine</h1>
      <p class="obP">Study blocks stay clear of sleep and fixed hours.</p>
      <div class="row" style="justify-content: space-between; margin-top: 10px;">
        <span><span class="lbl" style="display: block;">Wake up</span><span style="font-size: 24px; font-weight: 300;">{{wakeLabel}}</span></span>
        <span style="display: flex; gap: 10px;">
          <button class="stepBtn" onClick="{{wakeDown}}" aria-label="Wake earlier">−</button>
          <button class="stepBtn" onClick="{{wakeUp}}" aria-label="Wake later">+</button>
        </span>
      </div>
      <div class="row" style="justify-content: space-between;">
        <span><span class="lbl" style="display: block;">Sleep</span><span style="font-size: 24px; font-weight: 300;">{{sleepLabel}}</span></span>
        <span style="display: flex; gap: 10px;">
          <button class="stepBtn" onClick="{{sleepDown}}" aria-label="Sleep earlier">−</button>
          <button class="stepBtn" onClick="{{sleepUp}}" aria-label="Sleep later">+</button>
        </span>
      </div>
      <div class="lbl" style="margin: 22px 0 10px;">Best time for you to study</div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px;">
        <sc-for list="{{timeOpts}}" as="t" hint-placeholder-count="4">
          <button class="chip {{t.cls}}" onClick="{{t.pick}}" aria-pressed="{{t.on}}">{{t.label}}</button>
        </sc-for>
      </div>
      <div class="row" style="justify-content: space-between; margin-top: 14px;">
        <span style="display: flex; flex-direction: column; gap: 2px;"><span>College, school or work hours</span><span class="mute" style="font-size: 13px;">Optional</span></span>
        <button class="toggle {{commitCls}}" onClick="{{toggleCommit}}" aria-pressed="{{hasCommit}}" aria-label="College, school or work hours"></button>
      </div>
      <sc-if value="{{hasCommit}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; gap: 8px; margin: 16px 0 4px;">
          <sc-for list="{{commitKinds}}" as="k" hint-placeholder-count="3">
            <button class="chip {{k.cls}}" onClick="{{k.pick}}" aria-pressed="{{k.on}}">{{k.label}}</button>
          </sc-for>
        </div>
        <div class="row" style="justify-content: space-between;">
          <span><span class="lbl" style="display: block;">From</span><span style="font-size: 22px; font-weight: 300;">{{commitFromLabel}}</span></span>
          <span style="display: flex; gap: 10px;">
            <button class="stepBtn" onClick="{{cFromDown}}" aria-label="Start earlier">−</button>
            <button class="stepBtn" onClick="{{cFromUp}}" aria-label="Start later">+</button>
          </span>
        </div>
        <div class="row" style="justify-content: space-between;">
          <span><span class="lbl" style="display: block;">To</span><span style="font-size: 22px; font-weight: 300;">{{commitToLabel}}</span></span>
          <span style="display: flex; gap: 10px;">
            <button class="stepBtn" onClick="{{cToDown}}" aria-label="End earlier">−</button>
            <button class="stepBtn" onClick="{{cToUp}}" aria-label="End later">+</button>
          </span>
        </div>
      </sc-if>
    </sc-if>

    <sc-if value="{{ob.focus}}" hint-placeholder-val="{{ false }}">
      <h1 class="obH">How do you like to focus?</h1>
      <p class="obP">25 minutes on, 5 off is a good start. Adjust it to fit you.</p>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 24px;">
        <div class="card" style="display: flex; flex-direction: column; gap: 14px;">
          <span class="lbl">Focus</span>
          <span><span class="thin" style="font-size: 48px; color: #F5C59A;">{{focusLen}}</span> <span class="mute">min</span></span>
          <span style="display: flex; gap: 8px;">
            <button class="stepBtn" onClick="{{focusDown}}" aria-label="Shorter focus">−</button>
            <button class="stepBtn" onClick="{{focusUp}}" aria-label="Longer focus">+</button>
          </span>
        </div>
        <div class="card" style="display: flex; flex-direction: column; gap: 14px;">
          <span class="lbl">Rest</span>
          <span><span class="thin" style="font-size: 48px;">{{restLen}}</span> <span class="mute">min</span></span>
          <span style="display: flex; gap: 8px;">
            <button class="stepBtn" onClick="{{restDown}}" aria-label="Shorter rest">−</button>
            <button class="stepBtn" onClick="{{restUp}}" aria-label="Longer rest">+</button>
          </span>
        </div>
      </div>
      <div class="row" style="justify-content: space-between; margin-top: 8px;">
        <span style="display: flex; flex-direction: column; gap: 2px; padding-right: 12px;"><span>Longer break</span><span class="mute" style="font-size: 13px;">15 minutes after every 4 sessions</span></span>
        <button class="toggle {{tg.longBreak}}" onClick="{{toggleLongBreak}}" aria-pressed="{{prefs.longBreak}}" aria-label="Longer break after 4 sessions"></button>
      </div>
      <div class="row" style="justify-content: space-between;">
        <span style="display: flex; flex-direction: column; gap: 2px; padding-right: 12px;"><span>Start next session automatically</span><span class="mute" style="font-size: 13px;">Right after your break ends</span></span>
        <button class="toggle {{tg.autoNext}}" onClick="{{toggleAutoNext}}" aria-pressed="{{prefs.autoNext}}" aria-label="Auto-start next session"></button>
      </div>
      <div class="lbl" style="margin: 24px 0 12px;">Your day at a glance</div>
      <div style="display: flex; gap: 3px; height: 16px;" aria-hidden="true">
        <sc-for list="{{dayBlocks}}" as="b" hint-placeholder-count="7">
          <span style="flex: {{b.flex}} 1 0px; height: 16px; border-radius: 5px; background: {{b.bg}};"></span>
        </sc-for>
      </div>
      <p style="font-size: 15px; line-height: 1.5; margin: 14px 0 0;">{{dayGlance}}</p>
    </sc-if>

    <sc-if value="{{ob.ready}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; align-items: center; text-align: center;">
        <div class="lbl">All set</div>
        <h1 class="obH {{rdyIn}}" style="text-align: center; font-size: 34px;">Welcome{{readyName}}.</h1>
        <p class="obP {{rdyIn}}" style="max-width: 290px; transition-delay: .12s;">Your plan flows around your day, and reflows when the day changes.</p>
        <div class="{{rdyIn}}" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: 100%; margin-top: 22px; padding-top: 18px; border-top: 1px solid rgba(238,243,240,.14); transition-delay: .24s;">
          <sc-for list="{{readyStats}}" as="r" hint-placeholder-count="3">
            <div><div class="thin" style="font-size: 30px; color: {{r.color}};">{{r.value}}</div><div class="lbl" style="margin-top: 8px;">{{r.label}}</div></div>
          </sc-for>
        </div>
      </div>
    </sc-if>
  </div>

  <sc-if value="{{ob.ready}}" hint-placeholder-val="{{ false }}">
    <canvas id="rdyCv" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;" aria-hidden="true"></canvas>
  </sc-if>
  <div style="position: absolute; left: 24px; right: 24px; bottom: 34px; display: flex; align-items: center; justify-content: space-between; gap: 12px;">
    <sc-if value="{{ob.ready}}" hint-placeholder-val="{{ false }}">
      <button class="{{rdyGlow}}" data-rdy-btn="1" style="flex: 1; min-height: 60px; border-radius: 18px;" onClick="{{createPlan}}" aria-label="Reflow, go to Today">Reflow
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      </button>
    </sc-if>
    <sc-if value="{{obNotReady}}" hint-placeholder-val="{{ true }}">
      <sc-if value="{{obSkippable}}" hint-placeholder-val="{{ false }}">
        <button class="link" style="color: #B9CAC4;" onClick="{{obNext}}">Skip for now</button>
      </sc-if>
      <sc-if value="{{obNotSkippable}}" hint-placeholder-val="{{ true }}"><span></span></sc-if>
      <button class="fab" onClick="{{obNext}}" disabled="{{obNextDisabled}}" aria-label="Next">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      </button>
    </sc-if>
  </div>
  <sc-if value="{{rdyPlaying}}" hint-placeholder-val="{{ false }}">
    <button class="rdySkip" onClick="{{rdySkip}}">Skip</button>
  </sc-if>
</div>
</sc-if>

          <svg class="icon" style="color: #F5C59A;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
        </sc-if>

    <div class="lbl" style="margin: 26px 0 12px;">Time you still have today</div>

      <sc-for list="{{horizonOpts}}" as="h" hint-placeholder-count="3">
        <button class="tab {{h.cls}}" onClick="{{h.pick}}">{{h.label}}</button>
      </sc-for>
    </div>
    <p class="mute" style="font-size: 13px; line-height: 1.5; margin-top: 12px;">{{horizonHint}}</p>
  </div>
  <div style="position: absolute; left: 24px; right: 24px; bottom: 34px; display: flex; align-items: center; justify-content: space-between;">

    </button>
    </span>
  </div></div>
  <div class="sheetDark" style="border-radius: {{hd.rad}}px {{hd.rad}}px 0 0; padding-top: 8px;">

  </nav>
</sc-if>

<!-- ============ TASK SHEET ============ -->
<sc-if value="{{sheetTaskOpen}}" hint-placeholder-val="{{ false }}">
  <div class="overlay">
    <div class="panel" role="dialog" aria-label="Task details">
      <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;">
        <div>
          <div class="lblD" style="display: flex; align-items: center; gap: 8px;"><span class="dot" style="background: {{st.color}};"></span>{{st.subject}}</div>
          <div style="font-size: 22px; margin-top: 8px; line-height: 1.3;">{{st.title}}</div>
        </div>
        <button class="btnPaperLine" style="width: 44px; padding: 0; flex-shrink: 0;" onClick="{{closeSheet}}" aria-label="Close">
          <svg class="icon" style="width: 18px; height: 18px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin: 22px 0;">
        <div><div class="lblD">When</div><div style="font-size: 16px; margin-top: 4px;">{{st.when}}</div></div>
        <div><div class="lblD">Duration</div><div style="font-size: 16px; margin-top: 4px;">{{st.dur}}</div></div>
        <div><div class="lblD">Priority</div><div style="font-size: 16px; margin-top: 4px;">{{st.prio}}</div></div>
        <div><div class="lblD">Status</div><div style="font-size: 16px; margin-top: 4px;">{{st.stLabel}}</div></div>
      </div>
      <sc-if value="{{st.hasNote}}" hint-placeholder-val="{{ false }}">
        <p style="margin: 0 0 18px; font-size: 14px; color: #5E6F6B; line-height: 1.5;">{{st.note}}</p>
      </sc-if>
      <sc-if value="{{st.actionable}}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <button class="btnDark" style="min-height: 54px;" onClick="{{st.start}}">
            <svg class="icon" style="width: 18px; height: 18px; color: #F5C59A;" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"></path></svg>
            Start focus
          </button>
          <div style="display: flex; gap: 10px;">
            <button class="btnPaperLine" style="flex: 1;" onClick="{{st.moveTomorrow}}">Move to tomorrow</button>
            <button class="btnPaperLine" style="flex: 1;" onClick="{{st.split}}">Split in two</button>
          </div>
          <button class="btnPaperLine" onClick="{{st.missed}}">I missed this — help me reflow</button>
        </div>
      </sc-if>
      <sc-if value="{{st.locked}}" hint-placeholder-val="{{ false }}">
        <p style="margin: 0; font-size: 14px; color: #5E6F6B; line-height: 1.5;">Completed work is part of your history and isn’t moved by reflow.</p>
      </sc-if>
    </div>
  </div>
</sc-if>

<!-- ============ ADD TASK SHEET ============ -->
<sc-if value="{{addOpen}}" hint-placeholder-val="{{ false }}">
  <div class="overlay">
    <div class="panel" role="dialog" aria-label="Add task">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span style="font-size: 22px;">New task · {{planDayShort}}</span>
        <button class="btnPaperLine" style="width: 44px; padding: 0;" onClick="{{closeSheet}}" aria-label="Close">
          <svg class="icon" style="width: 18px; height: 18px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
      </div>
      <label for="rf-title" class="lblD" style="display: block; margin: 20px 0 8px;">Title</label>
      <input id="rf-title" class="field" placeholder="e.g. Thermodynamics problem set" value="{{draft.title}}" onChange="{{onDraftTitle}}">
      <div class="lblD" style="margin: 18px 0 8px;">Subject</div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <sc-for list="{{draftSubj}}" as="o" hint-placeholder-count="3">
          <button class="chipP {{o.cls}}" onClick="{{o.pick}}" aria-pressed="{{o.on}}"><span class="dot" style="background: {{o.color}};"></span>{{o.name}}</button>
        </sc-for>
      </div>
      <div class="lblD" style="margin: 18px 0 8px;">Duration</div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <sc-for list="{{draftDur}}" as="o" hint-placeholder-count="4">
          <button class="chipP {{o.cls}}" onClick="{{o.pick}}" aria-pressed="{{o.on}}">{{o.label}}</button>
        </sc-for>
      </div>
      <div class="lblD" style="margin: 18px 0 8px;">Priority</div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <sc-for list="{{draftPrio}}" as="o" hint-placeholder-count="3">
          <button class="chipP {{o.cls}}" onClick="{{o.pick}}" aria-pressed="{{o.on}}">{{o.label}}</button>
        </sc-for>
      </div>
      <p style="font-size: 13px; color: #5E6F6B; margin: 18px 0 0;">{{draftHint}}</p>
      <button class="btnDark" style="width: 100%; margin-top: 14px; min-height: 54px; opacity: {{draftOpacity}};" onClick="{{saveDraft}}" disabled="{{draftInvalid}}">Add to plan</button>
    </div>
  </div>
</sc-if>

</div>
</template>
<script src="/app.js" defer></script>
</body>
</html>
