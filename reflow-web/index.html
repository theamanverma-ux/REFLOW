/* focus room: same spot as home, seiza sitting, hands forward */

.sit .aviSeiza{opacity:1}
.sit .aviPoseG{transform:translateY(15px) scale(1.04,.95)}
.sit>ellipse:first-child{transform:scaleX(1.12);transform-box:fill-box;transform-origin:50% 50%}
.sit .aviBody{animation:aviSitBreath 3.8s ease-in-out infinite}
@keyframes aviSitBreath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.022,.982)}}
.rf.calm .sit .aviBody{animation:none}
/* Avi gait: feet stay planted — body speed matches stride (leg 40u, ±20°, 0.3s/step ≈ 67px/s) */
.walkin{animation:aviWalkIn 4.2s linear both}
.walking .aviLegL{animation:aviGait .6s linear infinite}
.walking .aviLegR{animation:aviGait .6s linear -.3s infinite}
@keyframes aviGait{0%{transform:rotate(-25deg);animation-timing-function:linear}50%{transform:rotate(25deg);animation-timing-function:cubic-bezier(.4,0,.5,1)}100%{transform:rotate(-25deg)}}
.walking .aviShinL{animation:aviKneeG .6s linear infinite}
.walking .aviShinR{animation:aviKneeG .6s linear -.3s infinite}
@keyframes aviKneeG{0%,50%{transform:rotate(0deg)}68%{transform:rotate(38deg)}88%{transform:rotate(8deg)}100%{transform:rotate(0deg)}}
.walking .aviBody{animation:aviStepG .3s ease-in-out infinite}
@keyframes aviStepG{0%,100%{transform:translateY(0) scale(1.012,.988)}50%{transform:translateY(-3px) scale(.994,1.006)}}
.walking .aviArmL{animation:aviArmGL .6s ease-in-out infinite}
.walking .aviArmR{animation:aviArmGR .6s ease-in-out infinite}
.walking .aviArmL{transform-origin:36px 120px}.walking .aviArmR{transform-origin:164px 120px}
@keyframes aviArmGL{0%,100%{transform:rotate(-22deg)}50%{transform:rotate(30deg)}}
@keyframes aviArmGR{0%,100%{transform:rotate(-40deg)}50%{transform:rotate(14deg)}}
.walking>ellipse:first-child{animation:aviShG .3s ease-in-out infinite}
@keyframes aviShG{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.96);opacity:.92}}

.dbTag{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.dbTag text{font-family:'AviHand',cursive;font-size:23px;font-weight:600;letter-spacing:.3px}
.db-pool .dbTag text{font-size:21px}
.dbGhost{animation:none!important}
.dbMenu{position:absolute;z-index:30;min-width:178px;background:#FFF9F1;border-radius:16px;padding:6px;box-shadow:0 10px 28px rgba(60,40,20,.22);display:flex;flex-direction:column;animation:dbPop .25s cubic-bezier(.3,1.5,.5,1)}
.dbMenuT{font-size:12px;color:#8A6A4E;padding:6px 10px 6px}
.dbMenuT b{font-weight:600;color:#3E5550}
.dbMenu button{display:flex;align-items:center;gap:9px;height:38px;padding:0 10px;border:none;background:none;border-radius:10px;font-family:inherit;font-size:14px;color:#2B3A37;text-align:left;cursor:pointer}
.dbMenu button:hover,.dbMenu button:focus-visible{background:#F3E4D2;outline:none}
.dbMenu button i{width:12px;height:12px;border-radius:50%}
@media (prefers-reduced-motion: reduce){.dbBlob{transition:none}.dbChip.dbPop,.dbMenu{animation:none}}
.obDecide{display:block;margin:18px auto 0;padding:8px 14px;border:none;background:none;font-family:inherit;font-size:14px;font-weight:500;color:#8A5A3B;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:4px;cursor:pointer}
.dbTools{gap:6px}
.dbAuto{font-size:13.5px}
.dbClear{padding:0 12px;font-size:13.5px}
.dpvOv{align-items:flex-end}
.dpvPanel{background:#FFF9F1;color:#2B3A37;max-height:72%;display:flex;flex-direction:column;border-radius:26px 26px 0 0}
.dpvHead{display:flex;align-items:center;justify-content:space-between;font-size:20px;font-weight:500;margin-bottom:10px}
.dpvX{width:36px;height:36px;border:none;border-radius:50%;background:#F3E4D2;color:#5E4B33;font-size:14px;cursor:pointer}
.dpvList{overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.dpvRow{display:grid;grid-template-columns:76px 10px 1fr auto;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid rgba(122,74,47,.08);font-size:15px}
.dpvRow i{width:10px;height:10px;border-radius:50%}
.dpvT{font-size:13px;color:#8A6A4E;font-variant-numeric:tabular-nums}
.dpvD{font-size:12.5px;color:#8A6A4E}
.dpvLife .dpvN{color:#8A5A3B}
.dpvNote{font-size:12.5px;color:#8A6A4E;margin:12px 0 0;line-height:1.4}
.dbLbl{font-family:'AviHand',cursive;font-size:19px;font-weight:600;line-height:1;letter-spacing:.2px;margin-bottom:1px}
.dayBlobs{height:auto;min-height:300px;transition:height .5s}
.dbSteps{display:flex;flex-direction:column;gap:2px;padding:2px 4px 6px;margin-bottom:4px;border-bottom:1px solid rgba(122,74,47,.1)}
.dbStep{display:grid;grid-template-columns:48px 32px 1fr 32px;align-items:center;gap:4px;font-size:12.5px;color:#8A6A4E}
.dbStep b{font-weight:600;color:#2B3A37;font-size:13.5px;text-align:center;white-space:nowrap}
.dbMenu .dbStep button{width:32px;height:32px;padding:0;justify-content:center;border-radius:50%;background:#F3E4D2;font-size:17px;color:#5E4B33}
.dpvRow{grid-template-columns:70px 10px 1fr auto;padding:9px 2px}
.dpvT{display:flex;flex-direction:column;line-height:1.15}
.dpvT small{font-size:11px;opacity:.7}
.dpvLen{display:flex;align-items:center;gap:6px}
.dpvLen button{width:30px;height:30px;border:none;border-radius:50%;background:#F3E4D2;color:#5E4B33;font-size:16px;font-family:inherit;cursor:pointer}
.dpvLen .dpvD{min-width:44px;text-align:center}
.dpvLateTag{display:inline-block;margin-left:6px;font-style:normal;font-size:10.5px;font-weight:600;color:#B5503A;background:#F9DCD3;border-radius:6px;padding:1px 6px;vertical-align:1px}
.scr.obCream{background:#F6F4EF!important}
.scr.obCream::before{opacity:.10}
.obCard{background:none;box-shadow:none;margin-top:44px;padding-bottom:4px}
.obSayB{background:#fff;box-shadow:0 3px 14px rgba(43,58,55,.08)}
.obSayB::after{background:#fff}
.obLead{color:#7A8A86}
.obBar{background:rgba(43,58,55,.10)}
.mdWS.big .mdT{background:#fff}
.dl{display:flex;flex-direction:column;gap:12px;margin-top:-4px}
.dlPart{background:#fff;border-radius:20px;padding:12px 12px 6px;border-left:5px solid;box-shadow:0 2px 10px rgba(43,58,55,.05)}
.dlHead{display:flex;align-items:center;gap:8px;padding:0 4px 6px}
.dlDot{width:10px;height:10px;border-radius:50%}

  <div class="scroll obBody" style="padding: 20px 24px 140px;">



    <sc-if value="{{ob.name}}" hint-placeholder-val="{{ true }}">
      <input id="rf-name" class="obField" placeholder="Your first name" value="{{nameVal}}" onChange="{{onName}}" autocomplete="given-name" aria-label="Your first name">
      <p class="obPriv"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.5"></rect><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"></path></svg>Your plan stays on your phone.</p>
    </sc-if>

    <sc-if value="{{ob.goal}}" hint-placeholder-val="{{ false }}">
      <div class="exGrid">
        <sc-for list="{{exCards}}" as="e" hint-placeholder-count="6">
          <button class="{{e.cls}}" onClick="{{e.pick}}" aria-pressed="{{e.on}}">
            <span class="exIc" style="{{e.tint}}">{{e.icon}}</span>
            <span class="exTx"><span class="exNm">{{e.name}}</span><span class="exSb">{{e.sub}}</span></span>
            <sc-if value="{{e.on}}" hint-placeholder-val="{{ false }}"><span class="exTick"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span></sc-if>
          </button>
        </sc-for>
      </div>
      <sc-if value="{{isCds}}" hint-placeholder-val="{{ true }}">
        <div class="card" style="margin-top: 20px; display: flex; flex-direction: column; gap: 16px;">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 14px;">
            <span style="display: flex; flex-direction: column; gap: 4px;"><span style="font-size: 16px;">Use built-in 4-month timetable</span><span class="mute" style="font-size: 13px; line-height: 1.45;">{{builtinHint}}</span></span>
            <button class="toggle {{builtinCls}}" onClick="{{toggleBuiltinOb}}" aria-pressed="{{cdsBuiltin}}" aria-label="Use built-in 4-month CDS timetable"></button>
          </div>
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;">
            <span class="mute" style="font-size: 14px;">Your track</span>
            <span style="display: flex; gap: 8px;">
              <sc-for list="{{trackOpts}}" as="o" hint-placeholder-count="2">
                <button class="chip {{o.cls}}" style="min-height: 40px; padding: 0 12px; font-size: 13px;" onClick="{{o.pick}}" aria-pressed="{{o.on}}">{{o.label}}</button>
              </sc-for>
            </span>
          </div>
          <span class="mute" style="font-size: 12px; line-height: 1.45;">You can change both later in Me.</span>
        </div>
      </sc-if>
    </sc-if>

    <sc-if value="{{ob.timetable}}" hint-placeholder-val="{{ false }}">
      <p class="obP">Add the study blocks you plan to follow each day or week. Only these will show on Today.</p>
      <sc-if value="{{tt.empty}}" hint-placeholder-val="{{ true }}">
        <p class="mute" style="font-size: 15px; line-height: 1.5; margin: 16px 0 4px;">No blocks yet. Add your first study block below.</p>
      </sc-if>
      <sc-for list="{{tt.rows}}" as="b" hint-placeholder-count="2">
        <div class="row" style="gap: 12px;">
          <span style="width: 50px; display: flex; flex-direction: column; gap: 2px;">
            <span style="font-size: 15px;">{{b.time}}</span>
            <span class="mute" style="font-size: 12px;">{{b.end}}</span>
          </span>
          <span style="width: 3px; align-self: stretch; border-radius: 3px; background: {{b.color}};"></span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0;">
            <span style="font-size: 15px;">{{b.title}}</span>
            <span class="mute" style="font-size: 13px;">{{b.subject}} · {{b.dur}} · {{b.days}}</span>
          </span>
          <button class="iconBtn" onClick="{{b.remove}}" aria-label="{{b.removeAria}}">
            <svg class="icon" style="width: 18px; height: 18px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
          </button>
        </div>
      </sc-for>
      <div class="card" style="margin-top: 18px; display: flex; flex-direction: column; gap: 14px;">
        <span class="lbl">Add a study block</span>
        <input class="fieldInline boxed" style="flex: none; width: 100%;" placeholder="What will you study? e.g. Algebra practice" value="{{bd.title}}" onChange="{{bd.onTitle}}" aria-label="Block title">
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
          <sc-for list="{{bd.subjOpts}}" as="o" hint-placeholder-count="3">
            <button class="chip {{o.cls}}" style="min-height: 40px; padding: 0 12px; font-size: 13px;" onClick="{{o.pick}}" aria-pressed="{{o.on}}"><span class="dot" style="background: {{o.color}};"></span>{{o.name}}</button>
          </sc-for>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <span><span class="lbl" style="display: block;">Starts at</span><span style="font-size: 24px; font-weight: 300;">{{bd.startLabel}}</span></span>
          <span style="display: flex; gap: 10px;">
            <button class="stepBtn" onClick="{{bd.startDown}}" aria-label="15 minutes earlier">−</button>
            <button class="stepBtn" onClick="{{bd.startUp}}" aria-label="15 minutes later">+</button>
          </span>
        </div>
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
          <sc-for list="{{bd.durOpts}}" as="o" hint-placeholder-count="5">
            <button class="chip {{o.cls}}" style="min-height: 40px; padding: 0 12px; font-size: 13px;" onClick="{{o.pick}}" aria-pressed="{{o.on}}">{{o.label}}</button>
          </sc-for>
        </div>
        <div>
          <div class="lbl" style="margin-bottom: 10px;">Repeats</div>
          <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px;">
            <sc-for list="{{bd.repeatOpts}}" as="o" hint-placeholder-count="3">
              <button class="chip {{o.cls}}" style="min-height: 40px; padding: 0 12px; font-size: 13px;" onClick="{{o.pick}}" aria-pressed="{{o.on}}">{{o.label}}</button>
            </sc-for>
          </div>
          <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px;">
            <sc-for list="{{bd.dayOpts}}" as="o" hint-placeholder-count="7">
              <button class="chip {{o.cls}}" style="min-height: 40px; padding: 0; justify-content: center; font-size: 13px;" onClick="{{o.pick}}" aria-pressed="{{o.on}}" aria-label="{{o.aria}}">{{o.label}}</button>
            </sc-for>
          </div>
        </div>
        <sc-if value="{{bd.hasWarn}}" hint-placeholder-val="{{ false }}">
          <p style="margin: 0; font-size: 13px; line-height: 1.45; color: #F1C3BE;">{{bd.warn}}</p>
        </sc-if>
        <button class="btnSoft" style="min-height: 52px; opacity: {{bd.opacity}};" onClick="{{bd.add}}" disabled="{{bd.invalid}}">Add to my timetable</button>
      </div>
      <p class="mute" style="font-size: 13px; line-height: 1.5; margin-top: 14px;">{{tt.summary}}</p>
      <sc-if value="{{tt.over}}" hint-placeholder-val="{{ false }}"><p style="font-size: 13px; line-height: 1.5; margin: 8px 0 0; color: #F5C59A;">{{tt.overText}}</p></sc-if>
    </sc-if>

    <sc-if value="{{ob.date}}" hint-placeholder-val="{{ false }}">
      <sc-if value="{{hasExamDate}}" hint-placeholder-val="{{ true }}">
        <div class="dtCard">
          <span class="lblD">{{dt.lbl}}</span>
          <span class="dtLong">{{dt.long}}</span>
          <svg viewBox="0 0 240 124" class="dtArc" aria-hidden="true"><path d="M20 112 A100 100 0 0 1 220 112" fill="none" stroke="#EDE9E0" stroke-width="14" stroke-linecap="round"></path><path d="M20 112 A100 100 0 0 1 220 112" fill="none" stroke="#F5C59A" stroke-width="14" stroke-linecap="round" style="{{dt.arc}}"></path></svg>
          <span class="dtNum">{{dt.days}}</span>
          <span class="dtSub">days to go</span>
        </div>
        <p class="obHint" style="text-align: center;">{{dt.hint}}</p>
      </sc-if>
      <sc-if value="{{dt.closed}}" hint-placeholder-val="{{ true }}">
        <button class="link obLink" style="display: block; margin: 6px auto 0;" onClick="{{dt.toggleOpen}}">Change date</button>
      </sc-if>
      <sc-if value="{{dt.open}}" hint-placeholder-val="{{ false }}">
        <sc-if value="{{hasExamDate}}" hint-placeholder-val="{{ true }}">
          <input type="date" class="obDate" value="{{oth.dateVal}}" onChange="{{oth.onDate}}" aria-label="Exam date">
        </sc-if>
        <div class="row obRow" style="justify-content: space-between; border-bottom: none;">
          <span>I don’t know the date yet</span>
          <button class="{{oth.noCls}}" onClick="{{toggleNoDate}}" aria-pressed="{{noExamDate}}" aria-label="No exam date yet"></button>
        </div>
      </sc-if>
    </sc-if>

    <sc-if value="{{ob.time}}" hint-placeholder-val="{{ false }}">
      <div style="padding: 28px 0 18px; border-bottom: 1px solid rgba(238,243,240,.14);">
        <div style="display: flex; align-items: baseline; justify-content: space-between;">
          <label for="rf-cur" class="lbl">On a typical day now</label>
          <span class="thin" style="font-size: 40px;">{{curLabel}}</span>
        </div>
        <input id="rf-cur" type="range" class="rng neutral" min="0" max="600" step="15" value="{{current}}" onChange="{{onCurrent}}">
        <div class="mute" style="display: flex; justify-content: space-between; font-size: 12px;"><span>0</span><span>5h</span><span>10h</span></div>
      </div>
      <div style="padding: 24px 0 18px;">
        <div style="display: flex; align-items: baseline; justify-content: space-between;">
          <label for="rf-tgt" class="lbl">Your daily target</label>
          <span class="thin" style="font-size: 40px; color: #F5C59A;">{{tgtLabel}}</span>
        </div>
        <input id="rf-tgt" type="range" class="rng" min="15" max="720" step="5" value="{{target}}" onChange="{{onTarget}}">
        <div class="mute" style="display: flex; justify-content: space-between; font-size: 12px;"><span>15m</span><span>6h</span><span>12h</span></div>
      </div>
    </sc-if>

    <sc-if value="{{ob.subjects}}" hint-placeholder-val="{{ false }}">
      <sc-if value="{{sj.pick}}" hint-placeholder-val="{{ true }}">
        <div class="sjWrap">
          <sc-for list="{{sj.chips}}" as="c" hint-placeholder-count="6"><button class="{{c.cls}}" onClick="{{c.tap}}"><i style="background: {{c.color}};"></i>{{c.name}}</button></sc-for>
          <sc-if value="{{sj.addClosed}}" hint-placeholder-val="{{ true }}"><button class="sjChip add" onClick="{{sj.openAdd}}">+ Add subject</button></sc-if>
        </div>
        <sc-if value="{{sj.addOpen}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; gap: 10px; margin-top: 12px;">
            <input class="obField sm" placeholder="Subject name" value="{{newSubj}}" onChange="{{onNewSubj}}" onKeyDown="{{sj.addKey}}" aria-label="New subject name">
            <button class="btnDark" style="min-height: 48px;" onClick="{{sj.addDone}}">Add</button>
          </div>
        </sc-if>
      </sc-if>
      <sc-if value="{{sj.edit}}" hint-placeholder-val="{{ false }}">
      <div style="margin-top: 14px;">
        <sc-for list="{{subjRows}}" as="o" hint-placeholder-count="4">
          <div class="row" style="gap: 10px; padding: 8px 0;">
            <span class="dot" style="background: {{o.color}};"></span>
            <input class="fieldInline" value="{{o.name}}" onChange="{{o.rename}}" aria-label="Subject name">
            <button class="prio {{o.prioCls}}" onClick="{{o.cycle}}" aria-label="{{o.prioAria}}">{{o.prioLabel}}</button>
            <button class="iconBtn" onClick="{{o.remove}}" aria-label="{{o.removeAria}}">
              <svg class="icon" style="width: 18px; height: 18px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
            </button>
          </div>
        </sc-for>
      </div>
      <div style="display: flex; gap: 10px; margin-top: 16px;">
        <input class="fieldInline boxed" placeholder="Add your own subject" value="{{newSubj}}" onChange="{{onNewSubj}}" onKeyDown="{{newSubjKey}}" enterkeyhint="done" aria-label="New subject name">
        <button class="chip" onClick="{{addSubj}}" disabled="{{newSubjEmpty}}">Add</button>
      </div>
      <sc-if value="{{hasSuggest}}" hint-placeholder-val="{{ false }}">
        <div class="lbl" style="margin: 22px 0 10px;">Suggested</div>
        <div style="display: flex; flex-wrap: wrap; gap: 8px;">
          <sc-for list="{{suggest}}" as="g" hint-placeholder-count="2">
            <button class="chip" onClick="{{g.add}}">+ {{g.name}}</button>
          </sc-for>
        </div>
      </sc-if>
      <p class="mute" style="font-size: 13px; line-height: 1.5; margin-top: 20px;">Tap the priority to switch between High, Normal and Low. High-priority subjects get more study blocks.</p>
      </sc-if>
    </sc-if>

    <sc-if value="{{ob.routine}}" hint-placeholder-val="{{ false }}">
      <div class="row" style="justify-content: space-between; margin-top: 4px;">
        <span><span class="lbl" style="display: block;">Wake up</span><span style="font-size: 24px; font-weight: 300;">{{wakeLabel}}</span></span>
        <span style="display: flex; gap: 10px;">
          <button class="stepBtn" onClick="{{wakeDown}}" aria-label="Wake earlier">−</button>
          <button class="stepBtn" onClick="{{wakeUp}}" aria-label="Wake later">+</button>
        </span>
      </div>
      <div class="row" style="justify-content: space-between;">
        <span><span class="lbl" style="display: block;">Sleep</span><span style="font-size: 24px; font-weight: 300;">{{sleepLabel}}</span></span>
        <span style="display: flex; gap: 10px;">
          <button class="stepBtn" onClick="{{sleepDown}}" aria-label="Sleep earlier">−</button>
          <button class="stepBtn" onClick="{{sleepUp}}" aria-label="Sleep later">+</button>
        </span>
      </div>
      <div class="lbl" style="margin: 22px 0 10px;">Best time for you to study</div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px;">
        <sc-for list="{{timeOpts}}" as="t" hint-placeholder-count="4">
          <button class="chip {{t.cls}}" onClick="{{t.pick}}" aria-pressed="{{t.on}}">{{t.label}}</button>
        </sc-for>
      </div>
      <div class="row" style="justify-content: space-between; margin-top: 14px;">
        <span style="display: flex; flex-direction: column; gap: 2px;"><span>College, school or work hours</span><span class="mute" style="font-size: 13px;">Optional</span></span>
        <button class="toggle {{commitCls}}" onClick="{{toggleCommit}}" aria-pressed="{{hasCommit}}" aria-label="College, school or work hours"></button>
      </div>
      <sc-if value="{{hasCommit}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; gap: 8px; margin: 16px 0 4px;">
          <sc-for list="{{commitKinds}}" as="k" hint-placeholder-count="3">
            <button class="chip {{k.cls}}" onClick="{{k.pick}}" aria-pressed="{{k.on}}">{{k.label}}</button>
          </sc-for>
        </div>
        <div class="row" style="justify-content: space-between;">
          <span><span class="lbl" style="display: block;">From</span><span style="font-size: 22px; font-weight: 300;">{{commitFromLabel}}</span></span>
          <span style="display: flex; gap: 10px;">
            <button class="stepBtn" onClick="{{cFromDown}}" aria-label="Start earlier">−</button>
            <button class="stepBtn" onClick="{{cFromUp}}" aria-label="Start later">+</button>
          </span>
        </div>
        <div class="row" style="justify-content: space-between;">
          <span><span class="lbl" style="display: block;">To</span><span style="font-size: 22px; font-weight: 300;">{{commitToLabel}}</span></span>
          <span style="display: flex; gap: 10px;">
            <button class="stepBtn" onClick="{{cToDown}}" aria-label="End earlier">−</button>
            <button class="stepBtn" onClick="{{cToUp}}" aria-label="End later">+</button>
          </span>
        </div>
      </sc-if>

        <div class="mute" style="font-size: 12px; text-align: center; margin-top: 8px; color: #5E6F6B;">You can undo it in Plan › Changes.</div>
      </sc-if>
      <sc-if value="{{rfV.dayApply}}" hint-placeholder-val="{{ false }}">
        <sc-if value="{{rfV.hasPrev}}" hint-placeholder-val="{{ false }}">
        <div class="rfPrev">
          <div class="lblD" style="margin-bottom: 6px;">What changes</div>
          <sc-for list="{{rfV.prev}}" as="pv" hint-placeholder-count="2">
            <div class="rfPrevRow"><span class="rfPrevT">{{pv.title}}</span><span class="rfPrevC">{{pv.change}}</span></div>
          </sc-for>
          <span style="font-size: 12px; color: #5E6F6B;">{{rfV.prevMore}}</span>
        </div>
        </sc-if>
        <sc-if value="{{rfV.noPrev}}" hint-placeholder-val="{{ false }}"><p style="font-size: 14px; color: #5E6F6B; margin: 16px 0 0;">Nothing left to change today.</p></sc-if>
        <button class="btnDark" style="width: 100%; min-height: 54px; margin-top: 18px;" onClick="{{rfV.apply}}">{{rfV.applyLabel}}</button>
        <div class="mute" style="font-size: 12px; text-align: center; margin-top: 8px; color: #5E6F6B;">You can undo it in Plan › Changes.</div>
      </sc-if>
    </div>
  </div>
</sc-if>

<!-- ============ QUICK LOG + MOCK SHEETS ============ -->
<sc-if value="{{x3.logOpen}}" hint-placeholder-val="{{ false }}">
  <div class="x3Ov" onClick="{{x3.closeLog}}"><div class="x3Sheet" onClick="{{x3.stop}}">
    <div class="x3SH"><b>Log study</b><button class="iconBtn" onClick="{{x3.closeLog}}" aria-label="Close">✕</button></div>
    <p class="mute" style="font-size: 13px; margin: 0 0 12px;">Studied from a book, class or library? Add it here.</p>
    <div class="lbl" style="margin-bottom: 8px;">Subject</div>
    <div class="x3Chips"><sc-for list="{{x3.logSubs}}" as="c" hint-placeholder-count="4"><button class="{{c.cls}}" onClick="{{c.pick}}"><span class="sdot" style="{{c.dot}}"></span>{{c.label}}</button></sc-for></div>
    <div class="lbl" style="margin: 16px 0 8px;">How long</div>
    <div class="x3Chips"><sc-for list="{{x3.logMins}}" as="c" hint-placeholder-count="5"><button class="{{c.cls}}" onClick="{{c.pick}}">{{c.label}}</button></sc-for></div>
    <button class="btnSoft" style="width: 100%; margin-top: 20px; min-height: 54px;" onClick="{{x3.saveLog}}">Log it</button>
  </div></div>
</sc-if>
<sc-if value="{{x3.mockOpen}}" hint-placeholder-val="{{ false }}">
  <div class="x3Ov" onClick="{{x3.closeMock}}"><div class="x3Sheet" onClick="{{x3.stop}}">
    <div class="x3SH"><b>Log a mock test</b><button class="iconBtn" onClick="{{x3.closeMock}}" aria-label="Close">✕</button></div>
    <div class="row" style="justify-content: space-between;"><span>Score</span><span style="display: flex; gap: 10px; align-items: center;"><button class="stepBtn" onClick="{{x3.mockDown}}" aria-label="Lower">−</button><b style="min-width: 54px; text-align: center; font-weight: 400; font-size: 22px;">{{x3.mockScore}}</b><button class="stepBtn" onClick="{{x3.mockUp}}" aria-label="Higher">+</button></span></div>
    <div class="lbl" style="margin: 16px 0 8px;">Weakest section</div>
    <div class="x3Chips"><sc-for list="{{x3.mockWeak}}" as="c" hint-placeholder-count="4"><button class="{{c.cls}}" onClick="{{c.pick}}"><span class="sdot" style="{{c.dot}}"></span>{{c.label}}</button></sc-for></div>
    <button class="btnSoft" style="width: 100%; margin-top: 20px; min-height: 54px;" onClick="{{x3.saveMock}}">Save</button>
  </div></div>
</sc-if>

<!-- ============ PUSH (simulated notification) ============ -->
<sc-if value="{{hasPush}}" hint-placeholder-val="{{ false }}">
  <div class="pushN" role="status" aria-live="polite">
    <span class="pushIc" aria-hidden="true"><svg viewBox="20 18 160 120" style="width: 26px; height: 20px;"><circle cx="80" cy="46" r="18" fill="#F5C59A"></circle><circle cx="119" cy="42" r="20" fill="#F5C59A"></circle><path d="M100 40 C142 40 170 74 172 116 C174 156 148 176 100 176 C52 176 26 156 28 116 C30 74 58 40 100 40 Z" fill="#F5C59A"></path><circle cx="84" cy="104" r="9" fill="#3A2A20"></circle><circle cx="120" cy="104" r="9" fill="#3A2A20"></circle></svg></span>
    <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;"><b style="font-size: 13px;">{{push.title}} · now</b><span style="font-size: 14px; line-height: 1.35;">{{push.body}}</span></span>
    <button onClick="{{closePush}}" aria-label="Dismiss"><svg class="icon" style="width: 16px; height: 16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
  </div>
</sc-if>

<!-- ============ BREATHE WITH AVI ============ -->
<sc-if value="{{br.on}}" hint-placeholder-val="{{ false }}">
  <div class="breatheOv" role="dialog" aria-label="Breathe with Avi">
    <div class="lblD">Breathe with Avi</div>
    <div class="brCircle {{br.cls}}" aria-hidden="true"><div class="brCore"></div></div>
    <div style="font-size: 28px; font-weight: 300;" aria-live="polite">{{br.text}}</div>
    <div class="mute" style="color: #5E6F6B; font-size: 14px;">4 seconds in, 4 seconds out · {{br.left}}</div>
    <button class="btnDark" style="margin-top: 16px; padding: 0 28px;" onClick="{{stopBreathe}}">I feel better</button>
  </div>
</sc-if>

<sc-if value="{{pw.binShow}}" hint-placeholder-val="{{ false }}">
  <div class="{{pw.binCls}}" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"></path></svg>Drop here to remove</div>
</sc-if>
<!-- ============ EXAM SWITCH CONFIRMATION ============ -->
<sc-if value="{{exd.show}}" hint-placeholder-val="{{ false }}">
  <div class="mDim" onClick="{{exd.ok}}"></div>
  <div class="mSheet" role="dialog" aria-label="{{exd.title}}">
    <div class="lblD">Plan updated</div>
    <div style="font-size: 22px; margin: 4px 0 4px;">{{exd.title}}</div>
    <p style="font-size: 14px; color: #5E6F6B; margin: 0 0 10px;">{{exd.sub}}</p>
    <sc-if value="{{exd.hasRows}}" hint-placeholder-val="{{ true }}"><div class="exdList"><sc-for list="{{exd.rows}}" as="r" hint-placeholder-count="3"><div class="exdRow"><i style="{{r.dot}}"></i><span>{{r.t}}</span><small>{{r.time}}</small></div></sc-for></div></sc-if>
    <button class="btnDark" style="width: 100%; margin-top: 14px; min-height: 52px;" onClick="{{exd.ok}}">Looks good</button>
    <button class="btnLine" style="width: 100%; margin-top: 8px; min-height: 48px; color: #2B3A37; border-color: #cfc8bb;" onClick="{{exd.review}}">Review subjects</button>
  </div>
</sc-if>
<!-- ============ AVI INTRO (once per feature) ============ -->
<sc-if value="{{intro.show}}" hint-placeholder-val="{{ false }}">
  <div class="{{intro.cls}}" role="status">
    <sc-if value="{{intro.avi}}" hint-placeholder-val="{{ true }}">
      <svg class="aiHead" viewBox="20 18 160 165" style="filter: {{aviFilter}};" aria-hidden="true">
        <circle cx="80" cy="46" r="18" fill="#F5C59A"></circle><circle cx="116" cy="40.5" r="18.6" fill="#F5C59A"></circle>
        <path d="M100 40 C142 40 170 74 172 116 C174 156 148 176 100 176 C52 176 26 156 28 116 C30 74 58 40 100 40 Z" fill="#F5C59A"></path>
        <path d="M156 70 C168 88 174 108 172 124 C170 150 152 170 124 175 C146 160 158 140 160 116 C161 100 160 84 156 70 Z" fill="#EBB383"></path>
        <ellipse cx="80" cy="102" rx="18" ry="21" fill="#FFF8F0"></ellipse><circle cx="82" cy="104" r="10" fill="#3A2A20"></circle><circle cx="86" cy="99" r="3.5" fill="#fff"></circle>
        <ellipse cx="120" cy="102" rx="18" ry="21" fill="#FFF8F0"></ellipse><circle cx="122" cy="104" r="10" fill="#3A2A20"></circle><circle cx="126" cy="99" r="3.5" fill="#fff"></circle>
        <path d="M88 134 Q100 146 112 134" stroke="#5A3A26" stroke-width="4" fill="none" stroke-linecap="round"></path>
      </svg>
    </sc-if>
    <div class="aiBody"><b>{{intro.name}}</b><span>{{intro.text}}</span></div>
    <button class="aiOk" onClick="{{intro.ok}}">Got it</button>
  </div>
</sc-if>
<!-- ============ NOTIFICATIONS: in-app banner ============ -->
<sc-if value="{{nb.show}}" hint-placeholder-val="{{ false }}">
  <div class="{{nb.cls}}" role="status" onClick="{{nb.open}}">
    <div class="nbHd"><span class="nbAp"><svg class="nbIc" viewBox="20 18 160 165" aria-hidden="true"><circle cx="80" cy="46" r="18" fill="#F5C59A"></circle><circle cx="116" cy="40.5" r="18.6" fill="#F5C59A"></circle><path d="M100 40 C142 40 170 74 172 116 C174 156 148 176 100 176 C52 176 26 156 28 116 C30 74 58 40 100 40 Z" fill="#F5C59A"></path><ellipse cx="80" cy="102" rx="18" ry="21" fill="#FFF8F0"></ellipse><circle cx="82" cy="104" r="10" fill="#3A2A20"></circle><ellipse cx="120" cy="102" rx="18" ry="21" fill="#FFF8F0"></ellipse><circle cx="122" cy="104" r="10" fill="#3A2A20"></circle><path d="M88 134 Q100 146 112 134" stroke="#5A3A26" stroke-width="5" fill="none" stroke-linecap="round"></path></svg></span><span class="nbApp">{{nb.app}}</span><span class="nbW">now</span><button class="nbX" onClick="{{nb.close}}" aria-label="Dismiss">×</button></div>
    <b class="nbT">{{nb.title}}</b><span class="nbBd">{{nb.body}}</span>
    <sc-if value="{{nb.hasActs}}" hint-placeholder-val="{{ true }}"><div class="nbActs"><sc-for list="{{nb.acts}}" as="a" hint-placeholder-count="2"><button onClick="{{a.fn}}">{{a.label}}</button></sc-for></div></sc-if>
  </div>
</sc-if>
<!-- ============ NOTIFICATIONS: lock screen preview ============ -->
<sc-if value="{{lk.show}}" hint-placeholder-val="{{ false }}">
  <div class="lock" role="dialog" aria-label="Lock screen preview">
    <i class="lkGlow g1"></i><i class="lkGlow g2"></i>
    <div class="lkTop"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2.5"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg></div>
    <div class="lkDate">{{lk.date}}</div><div class="lkTime">{{lk.time}}</div>
    <sc-if value="{{lk.quiet}}" hint-placeholder-val="{{ true }}"><div class="lkQuiet">☾ {{lk.quietTxt}}</div></sc-if>
    <div class="lkList">
      <sc-for list="{{lk.cards}}" as="c" hint-placeholder-count="3">
        <div class="{{c.cls}}" onClick="{{c.open}}">
          <div class="nbHd"><span class="nbAp"><svg class="nbIc" viewBox="20 18 160 165" aria-hidden="true"><circle cx="80" cy="46" r="18" fill="#F5C59A"></circle><circle cx="116" cy="40.5" r="18.6" fill="#F5C59A"></circle><path d="M100 40 C142 40 170 74 172 116 C174 156 148 176 100 176 C52 176 26 156 28 116 C30 74 58 40 100 40 Z" fill="#F5C59A"></path><ellipse cx="80" cy="102" rx="18" ry="21" fill="#FFF8F0"></ellipse><circle cx="82" cy="104" r="10" fill="#3A2A20"></circle><ellipse cx="120" cy="102" rx="18" ry="21" fill="#FFF8F0"></ellipse><circle cx="122" cy="104" r="10" fill="#3A2A20"></circle><path d="M88 134 Q100 146 112 134" stroke="#5A3A26" stroke-width="5" fill="none" stroke-linecap="round"></path></svg></span><span class="nbApp">{{c.app}}</span><span class="nbW">{{c.when}}</span></div>
          <b class="nbT">{{c.title}}</b><span class="nbBd">{{c.body}}</span>
          <sc-if value="{{c.hasActs}}" hint-placeholder-val="{{ false }}"><div class="nbActs"><sc-for list="{{c.acts}}" as="a" hint-placeholder-count="2"><button onClick="{{a.fn}}">{{a.label}}</button></sc-for></div></sc-if>
        </div>
      </sc-for>
      <sc-if value="{{lk.more}}" hint-placeholder-val="{{ true }}"><button class="lkMore" onClick="{{lk.showMore}}"><b>{{lk.moreLabel}}</b><small>{{lk.moreHint}}</small></button></sc-if>
    </div>
    <div class="lkFoot"><span class="lkHint">Tap a card for actions · tap again to open</span><button class="lkClose" onClick="{{lk.close}}">Close preview</button></div>
  </div>
</sc-if>
<!-- ============ TOAST ============ -->
<sc-if value="{{hasToast}}" hint-placeholder-val="{{ false }}">
  <div class="toast" role="status">
    <span style="flex: 1;">{{toast.text}}</span>
    <sc-if value="{{toast.undo}}" hint-placeholder-val="{{ false }}"><button onClick="{{undo}}">Undo</button></sc-if>
    <button onClick="{{closeToast}}" aria-label="Dismiss">
      <svg class="icon" style="width: 16px; height: 16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
  </div>
</sc-if>

<!-- ============ BOTTOM NAV ============ -->
<sc-if value="{{showNav}}" hint-placeholder-val="{{ false }}">
  <nav class="nav" aria-label="Main" style="transform: translateY({{navShift}}px);">
    <svg class="navBg" viewBox="0 0 366 76" aria-hidden="true"><path d="{{navPath}}" fill="#F6F4EF"></path></svg>
    <span class="navDot" style="left: {{navDotX}}px;" aria-hidden="true"></span>
    <sc-for list="{{navItems}}" as="n" hint-placeholder-count="5">
      <button class="navb {{n.cls}}" onClick="{{n.go}}" aria-current="{{n.current}}">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{n.stroke}}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"></path></svg>
        <span>{{n.label}}</span>
      </button>
    </sc-for>
  </nav>
</sc-if>

<!-- ============ TASK SHEET ============ -->
<sc-if value="{{sheetTaskOpen}}" hint-placeholder-val="{{ false }}">
  <div class="overlay">
    <div class="panel" role="dialog" aria-label="Task details">
      <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;">
        <div>
          <div class="lblD" style="display: flex; align-items: center; gap: 8px;"><span class="dot" style="background: {{st.color}};"></span>{{st.subject}}</div>
          <div style="font-size: 22px; margin-top: 8px; line-height: 1.3;">{{st.title}}</div>
        </div>
        <button class="btnPaperLine" style="width: 44px; padding: 0; flex-shrink: 0;" onClick="{{closeSheet}}" aria-label="Close">
          <svg class="icon" style="width: 18px; height: 18px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin: 22px 0;">
        <div><div class="lblD">When</div><div style="font-size: 16px; margin-top: 4px;">{{st.when}}</div></div>
        <div><div class="lblD">Duration</div><div style="font-size: 16px; margin-top: 4px;">{{st.dur}}</div></div>
        <div><div class="lblD">Priority</div><div style="font-size: 16px; margin-top: 4px;">{{st.prio}}</div></div>
        <div><div class="lblD">Status</div><div style="font-size: 16px; margin-top: 4px;">{{st.stLabel}}</div></div>
      </div>
      <sc-if value="{{st.hasNote}}" hint-placeholder-val="{{ false }}">
        <p style="margin: 0 0 18px; font-size: 14px; color: #5E6F6B; line-height: 1.5;">{{st.note}}</p>
      </sc-if>
      <sc-if value="{{st.actionable}}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <button class="btnDark" style="min-height: 54px;" onClick="{{st.start}}">
            <svg class="icon" style="width: 18px; height: 18px; color: #F5C59A;" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"></path></svg>
            Start focus
          </button>
          <div style="display: flex; gap: 10px;">
            <button class="btnPaperLine" style="flex: 1;" onClick="{{st.moveTomorrow}}">Move to tomorrow</button>
            <button class="btnPaperLine" style="flex: 1;" onClick="{{st.split}}">Split in two</button>
          </div>
          <button class="btnPaperLine" onClick="{{st.remove}}">Remove from today</button>
        </div>
      </sc-if>
      <sc-if value="{{st.locked}}" hint-placeholder-val="{{ false }}">
        <p style="margin: 0; font-size: 14px; color: #5E6F6B; line-height: 1.5;">Completed work is part of your history and isn’t moved by reflow.</p>
      </sc-if>
    </div>
  </div>
</sc-if>

<!-- ============ ADD TASK SHEET ============ -->
<sc-if value="{{addOpen}}" hint-placeholder-val="{{ false }}">
  <div class="overlay">
    <div class="panel" role="dialog" aria-label="Add task">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span style="font-size: 22px;">New task · {{planDayShort}}</span>
        <button class="btnPaperLine" style="width: 44px; padding: 0;" onClick="{{closeSheet}}" aria-label="Close">
          <svg class="icon" style="width: 18px; height: 18px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
      </div>
      <label for="rf-title" class="lblD" style="display: block; margin: 20px 0 8px;">Title</label>
      <input id="rf-title" class="field" placeholder="e.g. Thermodynamics problem set" value="{{draft.title}}" onChange="{{onDraftTitle}}">
      <div class="lblD" style="margin: 18px 0 8px;">Subject</div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <sc-for list="{{draftSubj}}" as="o" hint-placeholder-count="3">
          <button class="chipP {{o.cls}}" onClick="{{o.pick}}" aria-pressed="{{o.on}}"><span class="dot" style="background: {{o.color}};"></span>{{o.name}}</button>
        </sc-for>
        <button class="{{draftNew.cls}}" style="min-width: 44px; font-size: 18px;" onClick="{{draftNew.tog}}" aria-label="Add a new subject">+</button>
      </div>
      <sc-if value="{{draftNew.open}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; gap: 8px; margin-top: 10px;"><input class="field" style="flex: 1;" placeholder="New subject name" value="{{draftNew.val}}" onChange="{{draftNew.on}}" onKeyDown="{{draftNew.key}}" aria-label="New subject name"><button class="btnDark" style="min-height: 48px; padding: 0 18px;" onClick="{{draftNew.add}}">Add</button></div>
      </sc-if>
      <div class="lblD" style="margin: 18px 0 8px;">Duration</div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <sc-for list="{{draftDur}}" as="o" hint-placeholder-count="4">
          <button class="chipP {{o.cls}}" onClick="{{o.pick}}" aria-pressed="{{o.on}}">{{o.label}}</button>
        </sc-for>
      </div>
      <div class="lblD" style="margin: 18px 0 8px;">Priority</div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <sc-for list="{{draftPrio}}" as="o" hint-placeholder-count="3">
          <button class="chipP {{o.cls}}" onClick="{{o.pick}}" aria-pressed="{{o.on}}">{{o.label}}</button>
        </sc-for>
      </div>
      <p style="font-size: 13px; color: #5E6F6B; margin: 18px 0 0;">{{draftHint}}</p>
      <button class="btnDark" style="width: 100%; margin-top: 14px; min-height: 54px; opacity: {{draftOpacity}};" onClick="{{saveDraft}}" disabled="{{draftInvalid}}">Add to plan</button>
    </div>
  </div>
</sc-if>

</div>
</template>
<script src="/app.js?v=202611120143" defer></script>
</body>
</html>
